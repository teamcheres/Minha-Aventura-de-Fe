  <body>

    <div class="card-container">
      <div class="sparkle-badge">✨</div>
      
      <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 mb-3 leading-snug">
        Qual o nome da criança que você quer ver brilhando nas histórias de Jesus?
      </h1>
      
      <p class="text-slate-500 text-sm sm:text-base mb-8">
        Vamos preparar uma demonstração mágica para vocês.
      </p>

      <form id="child-name-form">
        <input 
          type="text" 
          id="child-name-input" 
          class="input-name" 
          placeholder="Digite o primeiro nome aqui" 
          required 
          autocomplete="off" 
          autofocus
        >
        <div id="error-message" class="error-msg">Por favor, digite o nome da criança.</div>

        <button type="submit" class="btn-submit">
          ✨ CRIAR AVENTURA MÁGICA
        </button>
      </form>

      <div class="badge-free">
        <span>🟡 100% Gratuito • Sem Cadastro</span>
      </div>
    </div>

    <script>
      document.getElementById('child-name-form').addEventListener('submit', function(e) {
        e.preventDefault();
        var input = document.getElementById('child-name-input');
        var error = document.getElementById('error-message');
        var val = input.value ? input.value.trim() : '';

        if (!val) {
          error.style.display = 'block';
          return;
        }

        error.style.display = 'none';
        // Capitalize first letter
        var nameFormatted = val.charAt(0).toUpperCase() + val.slice(1);
        
        // Save to localStorage
        localStorage.setItem('childName', nameFormatted);
        
        // Redirect to offer page on localhost:8090/oferta
        window.location.href = '/oferta';
      });
    </script>
